# Saaf Milk CI (audit finding C2).
#
# Runs the host-side gates on every push and PR: the full JVM unit-test suite
# (~900 tests incl. the sync decision/label/contract suites and the money-core
# Robolectric harness — Sale/DailyClose/Correction/closed-day-refusal through
# the real Room database) plus the two cross-platform python gates. qaFast's
# powershell sub-gates stay local for now (Windows-bound scripts).
#
# NOTE: the repository exists (private) and was pushed once on 2026-09-27;
# this workflow first ACTIVATES with the 2026-10-08 push — every push/PR from
# now on runs it.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (platform 36)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads android-all jars into ~/.m2 at test runtime —
      # outside the Gradle cache — so cache that subtree separately.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ runner.os }}-v1
          restore-keys: robolectric-android-all-${{ runner.os }}-

      - name: JVM unit tests
        working-directory: phase18
        run: ./gradlew :app:testDebugUnitTest --continue

      - name: Bridge contract gate
        working-directory: phase18
        run: ./gradlew verifyBridgeContract

      - name: UI cleanup gate
        working-directory: phase18
        run: ./gradlew verifyUiCleanup
